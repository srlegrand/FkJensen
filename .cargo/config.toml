# Build for the processor doing the build: AVX2 and FMA (AVX-512 where
# there is one) on the desktop, the laptop and Windows, so the eight-wide
# SIMD in the renderer runs eight wide. The Raspberry Pi build is cross
# compiled for its own target and keeps its own flags.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=native"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=native"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=native"]
