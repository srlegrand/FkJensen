name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - name: Fetch test scenes
        run: GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 https://github.com/usd-wg/assets ../assets
      - name: Render test scenes headless
        run: |
          ./target/release/fkjensen ../assets/full_assets/OpenChessSet/chess_set.usda --png chess_set.png --size 1280x720
          ./target/release/fkjensen ../assets/full_assets/CarbonFrameBike/CarbonFrameBike.usdz --png bike.png --size 1280x720
      - uses: actions/upload-artifact@v4
        with:
          name: renders
          path: "*.png"
