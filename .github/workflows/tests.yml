name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - name: Render the built-in scene headless
        run: |
          ./target/release/fkjensen --png chess_set.png --size 1280x720
          ./target/release/fkjensen --png chess_set_moved_light.png --size 1280x720 --light 0.1,0.3,0.2,0.5
      - uses: actions/upload-artifact@v4
        with:
          name: renders
          path: "*.png"
