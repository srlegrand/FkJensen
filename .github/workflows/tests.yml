name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - name: Render the built-in scene headless
        run: |
          ./target/release/fkjensen --png set_wide.png --size 1280x720
          ./target/release/fkjensen --png set_close.png --size 1280x720 --close
          ./target/release/fkjensen --png light_count.png --size 1280x720 --view lights
          ./target/release/fkjensen --png brightest_light_count.png --size 1280x720 --view lights --light -0.2,1.1,0.22,2000000
      - uses: actions/upload-artifact@v4
        with:
          name: renders
          path: "*.png"
