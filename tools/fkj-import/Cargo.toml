[package]
name = "fkj-import"
version = "0.1.0"
edition = "2024"
description = "Converts glTF and FBX models to FkJensen's .fkj, with per-triangle texture tiles"

[dependencies]
glam = "0.34.1"
gltf = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
flate2 = "1"
rayon = "1.12.0"
